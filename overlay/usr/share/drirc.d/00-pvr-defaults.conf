<driconf>
    <!-- Default optimizations for PowerVR Rogue BXM-4-64 via Mesa Zink -->
    <device driver="zink">
        <application name="Default" executable=".*">
            <option name="mesa_glthread" value="true" />
            <option name="radeonsi_inline_uniforms" value="true" />
        </application>

        <!-- Chromium has its own internal GPU process & command buffer threads;
             avoid double-threading which causes fence deadlocks during video playback -->
        <application name="Chromium" executable="chromium">
            <option name="mesa_glthread" value="false" />
        </application>
        <application name="Chromium-Browser" executable="chromium-browser">
            <option name="mesa_glthread" value="false" />
        </application>

        <!-- Media Players: enable multi-threaded GL dispatch -->
        <application name="MPV" executable="mpv">
            <option name="mesa_glthread" value="true" />
        </application>
        <application name="VLC" executable="vlc">
            <option name="mesa_glthread" value="true" />
        </application>
        <application name="GNOME Shell" executable="gnome-shell">
            <option name="mesa_glthread" value="true" />
        </application>
    </device>
</driconf>
