name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'
      release_title:
        description: 'Release Title'
        required: true
        default: 'Orange Pi 4 Pro Debian Bookworm (Linux 6.18 Mainline)'
      run_id:
        description: 'Workflow Run ID to fetch artifacts from'
        required: false
        default: '39145967587'
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release_files

          TARGET_RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -z "$TARGET_RUN_ID" ]; then
            # Find the latest successful image build run if not specified
            TARGET_RUN_ID=$(gh run list --workflow="Build Orange Pi 4 Pro Debian Bookworm Image" --status=success --limit=1 --json databaseId -q '.[0].databaseId')
          fi

          echo "Fetching artifacts from run ID: $TARGET_RUN_ID"
          gh run download "$TARGET_RUN_ID" -n orangepi4pro-bookworm-image --dir release_files/

          # Also attempt to download kernel deb packages from the latest successful kernel run
          KERNEL_RUN_ID=$(gh run list --workflow="Build Mainline 6.18 Kernel for Orange Pi 4 Pro" --status=success --limit=1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$KERNEL_RUN_ID" ]; then
            echo "Fetching kernel artifacts from run ID: $KERNEL_RUN_ID"
            gh run download "$KERNEL_RUN_ID" -n orangepi4pro-kernel-6.18 --dir release_files/ || true
          fi

          echo "Files ready for release:"
          ls -lh release_files/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TITLE="${{ github.event.inputs.release_title || github.ref_name }}"
          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          cat << 'EOF' > release_notes.md
## Orange Pi 4 Pro (Allwinner A733 / sun60iw2)

### Highlights
- **Kernel**: Mainline Linux 6.18.y (`linux-6.18.y`)
- **Distribution**: Debian 12 Bookworm (minimal)
- **Modularized Peripherals**: Network, GPU, Wi-Fi, and Bluetooth configured as on-demand modules (`=m`)
- **Memory & Power**: `cma=256M`, suspend/sleep disabled for maximum operational stability
- **Bootloader**: U-Boot next (`2021.07-sun60iw2`) with unified mainline DT aliases

### Verification
Checksums (`.sha256`) are provided alongside image assets for integrity verification.
EOF

          # Check if release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release: $TAG"
            gh release upload "$TAG" release_files/* --clobber
          else
            echo "Creating new release: $TAG"
            gh release create "$TAG" release_files/* \
              --title "$TITLE" \
              --notes-file release_notes.md \
              $PRERELEASE_FLAG
          fi
